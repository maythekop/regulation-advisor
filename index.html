<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ห้องหารือระเบียบงานจ้าง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== โทเคนสี: โทนเอกสารราชการ — กรมท่า + ฟ้าหม่น + ตราประทับแดง (ใช้แทนสถานะยกเลิก) ===== */
:root{
  --bg:#EDF0F3; --panel:#FFFFFF; --panel-2:#F4F6F8; --line:#CCD3DA; --text:#1B2733; --muted:#5A6873;
  --navy:#1F3A5F; --navy-ink:#FFFFFF; --accent:#2F6E8E; --ok:#2E7D4F; --warn:#B7791F; --bad:#B03A2E;
  --doc:#DCE7F0; --ana:#F6EAD2;
  --font:'Sarabun','Noto Sans Thai',Tahoma,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131C25; --panel:#1B2733; --panel-2:#223140; --line:#33475A; --text:#E7ECF1; --muted:#9FB0BF;
    --navy:#2C5282; --accent:#5FA8C9; --doc:#1F3A52; --ana:#43361C; --ok:#4DB27A; --warn:#E0A63C; --bad:#E07060;
  }
}
:root[data-theme="dark"]{--bg:#131C25;--panel:#1B2733;--panel-2:#223140;--line:#33475A;--text:#E7ECF1;--muted:#9FB0BF;--navy:#2C5282;--accent:#5FA8C9;--doc:#1F3A52;--ana:#43361C;--ok:#4DB27A;--warn:#E0A63C;--bad:#E07060}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:calc(76px + env(safe-area-inset-top,0px));scroll-padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
html.on-chat{scroll-padding-bottom:calc(330px + env(safe-area-inset-bottom,0px))}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16.5px;line-height:1.7}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:var(--navy-ink)}
.top-in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.seal{width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,255,255,.8);display:flex;align-items:center;justify-content:center;flex:none}
.seal svg{width:22px;height:22px}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font-size:19px;line-height:1.25;font-weight:700}
.brand p{margin:0;font-size:13px;opacity:.85}
.guide-btn{display:flex;align-items:center;gap:6px;border:1.5px solid rgba(255,255,255,.85);background:transparent;color:#fff;border-radius:6px;padding:6px 12px;font-size:14px;font-weight:600;white-space:nowrap}
.guide-btn svg{width:18px;height:18px}

main{max-width:820px;margin:0 auto;padding:18px 16px 110px}
h2{font-size:24px;line-height:1.3;margin:0 0 4px}
h3{font-size:17px;margin:22px 0 8px}
.lead{color:var(--muted);margin:0 0 16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
.note{font-size:13.5px;color:var(--muted);border-left:3px solid var(--warn);padding:4px 10px;margin:14px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:8px 14px;border-radius:6px;border:1.5px solid var(--line);background:var(--panel);font-weight:600}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.busy{opacity:.6;cursor:wait}
.btn.done{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{min-height:36px;padding:4px 10px;font-size:14px}

/* แท็กสถานะเอกสาร */
.tag{display:inline-block;border-radius:4px;padding:0 8px;font-size:12.5px;font-weight:700;line-height:1.7}
.t-live{background:rgba(46,125,79,.14);color:var(--ok)}
.t-amend{background:rgba(183,121,31,.16);color:var(--warn)}
.t-void{background:rgba(176,58,46,.14);color:var(--bad);text-decoration:line-through}
.t-cat{background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}
.t-fake{background:var(--ana);color:var(--text)}

/* การ์ดประกาศใหม่ */
.feed{display:grid;gap:12px}
.item{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--navy);border-radius:8px;padding:14px 16px}
.item h4{margin:6px 0 2px;font-size:17px;line-height:1.45}
.meta{font-size:13.5px;color:var(--muted)}
.item ul{margin:8px 0;padding-left:20px}
.impact{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.impact span{background:var(--doc);border-radius:4px;padding:0 8px;font-size:13px}
.queue .item{border-top-color:var(--warn)}

/* แชทหารือ */
.modes{display:flex;gap:8px;flex-wrap:wrap}
.modes button{border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 14px;font-weight:600;font-size:14.5px;min-height:38px}
.modes button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.chat{display:flex;flex-direction:column;gap:12px;margin:14px 0}
.msg{max-width:92%;border-radius:10px;padding:10px 14px}
.msg.me{align-self:flex-end;background:var(--navy);color:#fff;border-top-right-radius:3px}
.msg.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-top-left-radius:3px}
.msg.ai .who{font-size:13px;color:var(--muted);margin-bottom:4px}
.blk{border-radius:6px;padding:8px 12px;margin:8px 0}
.blk.doc{background:var(--doc)}
.blk.ana{background:var(--ana)}
.blk b.lbl{display:block;font-size:12.5px;letter-spacing:.01em;margin-bottom:2px}
.refs{font-size:13.5px;margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
.refs li{margin:2px 0}
.suggest{display:grid;gap:8px}
.suggest button{text-align:left;border:1px dashed var(--accent);background:var(--panel);border-radius:8px;padding:8px 12px;min-height:44px}
.composer{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--bg);padding:8px 0 4px}
textarea,input[type=search]{width:100%;border-radius:8px;border:1.5px solid var(--line);background:var(--panel);padding:10px 12px}
textarea{min-height:72px;resize:vertical}
.status{font-size:13.5px;color:var(--bad);min-height:1.2em}
.typing{color:var(--muted);font-size:14px}

/* คลังระเบียบ */
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.cats button{flex:none;border:1.5px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 12px;font-size:14px;min-height:38px;white-space:nowrap}
.cats button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.lib{display:grid;gap:8px;margin-top:10px}
.doc-row{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.doc-row b{display:block;line-height:1.45}
.chain{font-size:13.5px;color:var(--muted);margin-top:4px}
.drop{border:2px dashed var(--line);border-radius:8px;padding:14px;text-align:center;background:var(--panel-2)}

/* บันทึก */
.notes{display:grid;gap:10px}
.memo{background:#fff;color:#111;border:1px solid var(--line);border-radius:6px;padding:20px 22px;font-size:15.5px;white-space:pre-wrap;overflow-x:auto}

/* คู่มือย่อ */
.steps{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.steps li{display:grid;grid-template-columns:40px 1fr;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
.steps .n{width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.steps b{display:block}
.steps span{color:var(--muted);font-size:15px}
.legend{display:grid;gap:8px;margin-top:8px}
.legend div{display:flex;gap:10px;align-items:flex-start}


/* ===== คอนโซลเสียง ===== */
.voice{position:sticky;bottom:calc(66px + env(safe-area-inset-bottom,0px));background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px;box-shadow:0 -6px 18px rgba(0,0,0,.06)}
.vmain{display:flex;gap:14px;align-items:center}
.orb{width:72px;height:72px;border-radius:50%;border:0;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--navy);box-shadow:0 4px 14px rgba(31,58,95,.35);position:relative}
.orb svg{width:32px;height:32px}
.orb.s-listen{background:var(--bad);animation:pulse 1.2s ease-out infinite}
.orb.s-think{background:var(--accent);cursor:wait}
.orb.s-speak{background:var(--ok)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(176,58,46,.55)}100%{box-shadow:0 0 0 18px rgba(176,58,46,0)}}
.orb.s-speak rect{transform-origin:center;animation:wv .9s ease-in-out infinite}
.orb.s-speak .w2{animation-delay:.15s}.orb.s-speak .w3{animation-delay:.3s}.orb.s-speak .w4{animation-delay:.45s}
@keyframes wv{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1.15)}}
.orb.s-think circle{animation:dt 1s ease-in-out infinite}.orb .d2{animation-delay:.15s}.orb .d3{animation-delay:.3s}
@keyframes dt{0%,100%{opacity:.3}50%{opacity:1}}
.vtext{flex:1;min-width:0}
.vstate{font-weight:600}
.live{color:var(--muted);font-size:15px;min-height:1.4em}
.vopts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.vhint{display:block;font-size:13px;color:var(--muted);margin-top:6px}
.confirm{margin-top:10px;background:var(--panel-2);border-radius:8px;padding:10px}
.cf-q{font-weight:600;margin-bottom:6px}
.cf-bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:8px}
.cf-bar i{display:block;height:100%;width:0;background:var(--navy);transition:width 3s linear}
.spoken{border-left:3px solid var(--ok);padding:2px 10px;margin:6px 0;font-size:15.5px}
.spoken b.lbl{display:block;font-size:12.5px;color:var(--ok)}
#typeBox{margin-top:10px}
@media (max-width:420px){.orb{width:64px;height:64px}.voice{padding:10px}}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:820px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:transparent;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--muted);min-height:62px;position:relative}
nav.tabs svg{width:23px;height:23px}
nav.tabs button[aria-current="page"]{color:var(--navy);box-shadow:inset 0 3px 0 var(--navy);font-weight:700}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav.tabs button[aria-current="page"]{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}}
.badge-n{position:absolute;top:4px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:999px;font-size:11px;line-height:17px;min-width:17px;padding:0 4px;font-weight:700}

@media (max-width:420px){
  .brand p{display:none}
  .guide-btn span{font-size:13px}
  main{padding:14px 12px 110px}
  .msg{max-width:100%}
}
/* ===== ส่วนที่เพิ่มสำหรับระบบจริง ===== */
.login{display:grid;gap:6px;max-width:420px}
.login label{font-weight:600;font-size:14.5px;margin-top:6px}
.login input{width:100%;border-radius:8px;border:1.5px solid var(--line);background:var(--panel);padding:10px 12px;min-height:44px}
.login .btn{margin-top:8px}
.pinwrap{position:relative}
.pinwrap input{padding-right:48px}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;border-radius:6px}
.eye svg{width:22px;height:22px}
#logoutBtn{margin-right:0}
@media (max-width:520px){#logoutBtn span{display:none}#logoutBtn{padding:6px 8px}}
@media (max-width:420px){.guide-btn{padding:6px 8px}}
.blk.warnb{background:rgba(176,58,46,.10);border-left:3px solid var(--bad)}
.blk.warnb b.lbl{color:var(--bad)}
.wl{margin:2px 0;padding-left:18px;font-size:14.5px}
.cite{padding:6px 0;border-top:1px dashed rgba(0,0,0,.12)}
.cite:first-of-type{border-top:0}
.cite-h{font-size:14.5px;line-height:1.5}
.cite q{display:block;margin:4px 0;font-size:15.5px;quotes:"“" "”"}
.cite-p{font-size:13.5px;color:var(--muted)}
.cite-v{font-size:13.5px;color:var(--warn);font-weight:600}
details summary{cursor:pointer;color:var(--accent);font-size:14px;font-weight:600;min-height:32px;display:flex;align-items:center}
.clause{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-top:4px;font-size:15px}
.ver+.ver{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px}
.ctext{white-space:pre-wrap;margin-top:4px}
.btn.icon{min-width:40px;padding:4px 8px}
.btn.icon[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.doc-row a{color:var(--accent)}
.msg.ai{overflow-wrap:anywhere}
@media (max-width:600px){
  .voice textarea{min-height:52px}
  .voice .vhint:last-child{display:none}
  .vopts .btn.sm{min-height:34px;font-size:13.5px;padding:2px 8px}
  .vstate{font-size:15px;line-height:1.5}
}
@media (max-width:420px){.cite q{font-size:15px}.brand h1{font-size:17px}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="seal" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4H4z"/><path d="M5 10v7M9.5 10v7M14.5 10v7M19 10v7M3 20h18"/></svg></div>
    <div class="brand"><h1>ห้องหารือระเบียบงานจ้าง</h1><p>กฎหมาย ระเบียบ หนังสือเวียน ที่เกี่ยวกับงานของกรมทางหลวง</p></div>
    <button type="button" class="guide-btn" id="logoutBtn" data-logout="1" hidden aria-label="ออกจากระบบ" title="ออกจากระบบ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg><span>ออกจากระบบ</span></button>
    <button type="button" class="guide-btn" data-go="guide">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/><path d="M10 8h5M10 12h5"/></svg>
      <span>คู่มือย่อ</span>
    </button>
  </div>
</header>
<main id="main"></main>
<nav class="tabs" id="tabs" aria-label="เมนูหลัก" hidden>
  <div class="in">
    <button type="button" data-go="chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8 11h8M8 14h5"/></svg>หารือ</button>
    <button type="button" data-go="feed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>ประกาศใหม่<span class="badge-n" id="feedBadge" hidden>0</span></button>
    <button type="button" data-go="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h5v16H4zM10 4h4v16h-4z"/><path d="M15.5 5.5l3.8-1 3 14.5-3.8 1z"/></svg>คลังระเบียบ</button>
    <button type="button" data-go="notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/></svg>บันทึก</button>
  </div>
</nav>

<script>
/* =========================================================
   ห้องหารือระเบียบงานจ้าง — หน้าเว็บ (เชื่อมหลังบ้าน Google Apps Script)
   คลังเอกสาร (ชีต Library/Chunks) → ค้นข้อที่เกี่ยวข้อง → Gemini ตอบ → ด่านตรวจอ้างอิง → แสดง/พูด
   ========================================================= */
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

/*
 * ╔══════════════════════════════════════════════════════════════════════╗
 * ║  ⚙️ CONFIG สำหรับหน้าเว็บภายนอก (GitHub Pages / PWA) — กรอกก่อนใช้งาน   ║
 * ║  API_URL = URL ของเว็บแอป Apps Script ที่ลงท้ายด้วย /exec              ║
 * ║  ⚠️ วางไฟล์นี้ใหม่ทับเมื่อไร ต้องกรอก API_URL ใหม่ทุกครั้ง                ║
 * ║  (ถ้าเปิดผ่านเว็บแอป Apps Script โดยตรง ค่านี้ไม่ถูกใช้)                   ║
 * ╚══════════════════════════════════════════════════════════════════════╝
 */
var API_URL = 'https://script.google.com/macros/s/AKfycbzV1iysQZSRuxHc_mqaIT5FlOB40q1yIsc4v-mw1TmITu0s7BVwk9VCpFwv4IzMie60/exec';
/* ═══════════════════════════ จบส่วน CONFIG ═══════════════════════════ */

/* โหมด: เปิดผ่านเว็บแอป Apps Script (มี google.script.run) หรือหน้าเว็บภายนอกที่เรียก doPost */
var GAS_MODE = !!(window.google && google.script && google.script.run);
var AUTH = { token: '', user: null, lastEmail: '' };           // เก็บในหน่วยความจำเท่านั้น — รีเฟรชหน้า = เข้าสู่ระบบใหม่

/* ---------- เรียกหลังบ้าน: ทุกคำตอบเป็น {ok, error?} ---------- */
function api(fn,args,onOk,onErr){
  var fail=function(e){var m=(e&&e.message)?e.message:String(e||'เชื่อมต่อไม่สำเร็จ');if(onErr)onErr(m);else console.error(fn,m);};
  var done=function(res){
    if(res&&res.ok===false){
      if(res.code==='AUTH'&&!GAS_MODE){AUTH.token='';AUTH.user=null;updateAuthUI();ST.after=ST.screen;go('login');}
      fail({message:res.error||'เกิดข้อผิดพลาด'});return;
    }
    onOk&&onOk(res);
  };
  if(GAS_MODE){
    try{var r=google.script.run.withSuccessHandler(done).withFailureHandler(fail); r[fn].apply(r,args||[]);}catch(e){fail(e);}
    return;
  }
  if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(API_URL)){fail({message:'ยังไม่ได้กรอก API_URL ในไฟล์ index.html (URL เว็บแอปที่ลงท้ายด้วย /exec)'});return;}
  fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args||[],token:AUTH.token})})

/* แบ่งข้อความเป็นช่วงสั้นไม่เกิน ~110 ตัวอักษร ตัดที่ช่องว่าง (ภาษาไทยเว้นวรรคน้อย ต้องนับตัวอักษรแทนนับคำ) */
function splitSpeech(text){
  var words=String(text).replace(/\s+/g,' ').trim().split(' '), out=[], cur='';
  words.forEach(function(w){
    while(w.length>110){ if(cur){out.push(cur);cur='';} out.push(w.slice(0,110)); w=w.slice(110); }
    if((cur+' '+w).length>110&&cur){out.push(cur);cur=w;} else cur=cur?cur+' '+w:w;
  });
  if(cur) out.push(cur);
  return out;
}

/* ปรับคำที่ระบบรู้จำเสียงมักถอดผิด ให้เป็นรูปแบบเลขหนังสือ/ข้อระเบียบ */
function normalizeTh(s){
  return s.replace(/ว(?:\.|อ|ออ)?\s*(\d+)/g,'ว $1').replace(/มาตรา\s*(\d+)/g,'มาตรา $1').replace(/ข้อ\s*(\d+)/g,'ข้อ $1').replace(/\s+/g,' ').trim();

/* คำสั่งเสียง */
function voiceCommand(s){
  if(/^(หยุด|พอแล้ว|เงียบ)/.test(s)){stopAll();return true;}
  if(/(อ่าน|พูด)อีกครั้ง|ทวนอีกที/.test(s)){if(V.lastSay)say(V.lastSay);return true;}
  if(/^บันทึก/.test(s)){var b=document.querySelectorAll('[data-save]');var last=b[b.length-1];if(last&&!last.disabled)last.click();say('บันทึกข้อสรุปแล้วครับ');return true;}

  return false;
}
function listen(){

    var finalText='', live=document.getElementById('live');
    r.onstart=function(){setState('listen');live.textContent='';};
    r.onresult=function(e){var t='';for(var i=0;i<e.results.length;i++){t+=e.results[i][0].transcript;}finalText=t;live.textContent=t;};
    r.onerror=function(e){V.rec=null;setState('idle',e.error==='not-allowed'?'ไมโครโฟนถูกปิดกั้น — อนุญาตไมค์ในเบราว์เซอร์ แล้วแตะอีกครั้ง':(e.error==='no-speech'?'ไม่ได้ยินเสียง — แตะแล้วพูดใหม่อีกครั้ง':'รับเสียงไม่สำเร็จ ('+e.error+')'));};

function say(text,after){

  if(!('speechSynthesis' in window)||!V.thaiVoice){setState('idle','เครื่องนี้ไม่มีเสียงอ่านภาษาไทย — อ่านคำตอบบนจอแทน');if(after)after();return;}

    if(i>=parts.length){clearInterval(V.keep);setState('idle');if(after)after();else if(V.cont)setTimeout(listen,400);return;}

function initLogin(){

    pin.type=show?'text':'password';

function thDate(s){
  var m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})$/); if(!m) return s||'—';
  var M=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  return (+m[3])+' '+M[+m[2]-1]+' '+m[1];
}

/* ---------- ถาม → หลังบ้าน → แสดงคำตอบที่ผ่านด่านตรวจ ---------- */
function ask(q){
  var st=document.getElementById('askStatus'), btn=document.getElementById('askBtn'), chat=document.getElementById('chat');
  q=(q||'').trim(); if(!q){st.textContent='ยังไม่มีคำถาม — พูด พิมพ์ หรือแตะตัวอย่างคำถามก่อน'; return;}
  if(V.state==='think') return;
  st.textContent=''; btn.disabled=true; btn.classList.add('busy'); btn.querySelector('span').textContent='กำลังค้นคลังเอกสาร…';
  stopSpeak(); setState('think');
  var me=document.createElement('div'); me.className='msg me'; me.textContent=q; chat.appendChild(me);
  document.getElementById('ask').value='';
  me.scrollIntoView({block:'nearest',behavior:'smooth'});
  var history=ST.log.slice(-3).map(function(L){return {q:L.q,a:L.a.spoken};});
  var mode=ST.mode;
  function reset(){btn.disabled=false; btn.classList.remove('busy'); btn.querySelector('span').textContent='ส่งคำถาม';}
  api('apiAsk',[{question:q,mode:MODE_API[mode],history:history}],function(a){
    reset();
    ST.log.push({q:q,a:a,mode:mode}); var idx=ST.log.length-1;
    addAI(renderAnswer(a,idx,mode));
    say(a.spoken||'ได้คำตอบแล้ว รายละเอียดอยู่บนจอครับ');
  },function(err){
    reset(); setState('idle');
    addAI('<div class="who">ที่ปรึกษาระเบียบ</div><div class="blk warnb"><b class="lbl">ตอบไม่สำเร็จ</b>'+esc(err)+'</div>'+
      '<div class="row" style="margin-top:8px"><button type="button" class="btn sm" data-ask="'+esc(q)+'">ถามใหม่อีกครั้ง</button></div>');
  });
}
function renderAnswer(a,idx,mode){
  var h='<div class="who">ที่ปรึกษาระเบียบ · '+esc(MODES[mode])+(a.model?' · '+esc(a.model):'')+'</div>';
  if(a.asOfWhy&&a.asOfWhy!=='วันนี้') h+='<div class="note" style="margin:4px 0 8px;border-left-color:var(--accent)">เลือกฉบับระเบียบตามวันที่ '+esc(thDate(a.asOf))+' ('+esc(a.asOfWhy)+') และแสดงฉบับปัจจุบันประกอบ</div>';
  if(a.spoken) h+='<div class="spoken"><b class="lbl">สรุปที่พูด</b>'+esc(a.spoken)+'</div>';
  if(a.warnings&&a.warnings.length) h+='<div class="blk warnb"><b class="lbl">คำเตือน</b><ul class="wl">'+a.warnings.map(function(w){return '<li>'+esc(w)+'</li>';}).join('')+'</ul></div>';
  if(a.citations&&a.citations.length){
    h+='<div class="blk doc"><b class="lbl">อ้างอิงเอกสาร — ถ้อยคำตรวจกับต้นฉบับแล้ว</b>';
    a.citations.forEach(function(c,i){
      h+='<div class="cite"><div class="cite-h"><b>'+esc(c.docShort)+' · '+esc(c.disp)+'</b> <span class="tag t-cat">'+esc(c.label||('ฉบับที่ '+c.ver))+'</span>'+(c.docStatus?' '+statusTag(c.docStatus):'')+'</div>'+
        '<q>'+esc(c.quote)+'</q>'+(c.point?'<div class="cite-p">'+esc(c.point)+'</div>':'')+
        (c.versionNote?'<div class="cite-v">'+esc(c.versionNote)+'</div>':'')+
        '<details data-clause="'+esc(c.key)+'"><summary>ดูข้อเต็ม'+(c.page?' (ราชกิจจาฯ หน้า '+esc(c.page)+')':'')+'</summary><div class="clause">กำลังโหลด…</div></details></div>';
    });
    h+='</div>';
  }
  if(a.analysis) h+='<div class="blk ana"><b class="lbl">ความเห็นเชิงวิเคราะห์ — ต้องตรวจสอบก่อนใช้</b>'+esc(a.analysis)+'</div>';
  if(a.notFound&&a.retrieved&&a.retrieved.length) h+='<details class="refs"><summary>เอกสารที่ค้นดูแล้ว ('+a.retrieved.length+' รายการ)</summary><ul>'+a.retrieved.map(function(r){return '<li>'+esc(r.docShort)+' · '+esc(r.disp)+'</li>';}).join('')+'</ul></details>';
  if(a.notes&&a.notes.length) h+='<div class="meta" style="margin-top:6px">หมายเหตุระบบ: '+esc(a.notes.join(' · '))+'</div>';
  h+='<div class="row" style="margin-top:8px"><button type="button" class="btn sm" data-replay="'+idx+'">ฟังอีกครั้ง</button>'+
    '<button type="button" class="btn sm" data-save="'+idx+'"><span>บันทึกข้อสรุปนี้</span></button>'+
    (a.logId?'<button type="button" class="btn sm icon" data-fb="up" data-log="'+esc(a.logId)+'" aria-pressed="false" title="คำตอบนี้ใช้ได้" aria-label="ให้คะแนนว่าคำตอบนี้ใช้ได้">'+UP_SVG+'</button>'+
      '<button type="button" class="btn sm icon" data-fb="down" data-log="'+esc(a.logId)+'" aria-pressed="false" title="คำตอบนี้มีปัญหา" aria-label="ให้คะแนนว่าคำตอบนี้มีปัญหา">'+DOWN_SVG+'</button>':'')+'</div>'+
    '<div class="status" data-save-status="'+idx+'" role="status"></div>';
  if(a.followUp) h+='<div class="suggest" style="margin-top:8px"><button type="button" data-ask="'+esc(a.followUp)+'">ถามต่อ: '+esc(a.followUp)+'</button></div>';
  return h;
}
function loadClause(det){

   APP.cats.map(function(c){return '<button type="button" data-cat="'+esc(c.id)+'" aria-pressed="'+(ST.cat===c.id)+'">'+esc(c.name)+'</button>';}).join('')+'</div>'+
   '<div class="lib" id="lib"><div class="panel">กำลังโหลดคลัง…</div></div>'+
   '<h3>เพิ่มเอกสารเอง</h3><div class="drop"><p style="margin:0 0 8px">เช่น หนังสือเวียนที่ได้รับทางสารบรรณ — ไฟล์จะเข้า "คิวรอยืนยัน" ก่อน ผู้ช่วยยังอ้างไม่ได้จนกว่าจะนำข้อความเข้าคลัง</p>'+
   '<input type="file" id="pdf" accept="application/pdf" hidden>'+

var REL_TXT={'แก้ไข':'แก้ไข','เพิ่ม':'เพิ่มข้อใน','ซักซ้อม':'ซักซ้อม','ออกตามความใน':'ออกตามความใน','บทเฉพาะกาล':'บทเฉพาะกาลของ','ยกเลิก':'ยกเลิก'};
function docLinks(d){
  var seen={}, out=[];
  (d.links||[]).forEach(function(r){
    var fromDoc=String(r.from).split('-')[0], toDoc=String(r.to).split('-')[0], s;
    if(fromDoc===d.id) s=(REL_TXT[r.type]||r.type)+' '+docShort(toDoc);
    else s=(r.type==='แก้ไข'||r.type==='เพิ่ม'?'ถูกแก้ไขโดย':(r.type==='ซักซ้อม'?'มีหนังสือซักซ้อม':(r.type==='ออกตามความใน'?'มีระเบียบออกตามความใน':r.type+' จาก')))+' '+docShort(fromDoc);
    if(!seen[s]){seen[s]=1;out.push(s);}
  });
  return out.join(' · ');
}
function renderLib(){
  var box=document.getElementById('lib'); if(!box) return;
  if(!APP.docs){box.innerHTML='<div class="panel">กำลังโหลดคลัง…</div>';return;}
  var q=ST.q.toLowerCase();
  var rows=APP.docs.filter(function(l){return (ST.cat==='all'||l.cat===ST.cat)&&(!q||(l.title+' '+l.short+' '+l.no).toLowerCase().indexOf(q)>-1);});
  box.innerHTML=rows.length?rows.map(function(l){
    var chain=docLinks(l);
    return '<div class="doc-row"><div class="row" style="gap:6px">'+statusTag(l.status)+'<span class="tag t-cat">'+esc(catName(l.cat))+'</span><span class="tag t-cat">'+esc(l.id)+'</span></div>'+
      '<b style="margin-top:4px">'+esc(l.title)+'</b><div class="meta">'+(l.no?'ที่ '+esc(l.no)+' · ':'')+'ลงวันที่ '+esc(thDate(l.date))+' · ใช้บังคับ '+esc(thDate(l.eff))+' · '+l.units+' หน่วยที่ใช้อยู่</div>'+
      (l.source?'<div class="meta">ที่มา: '+esc(l.source)+(l.url?' · <a href="'+esc(l.url)+'" target="_blank" rel="noopener">ต้นฉบับ</a>':'')+'</div>':'')+
      (chain?'<div class="chain">'+esc(chain)+'</div>':'')+
      (l.pending?'<div class="chain" style="color:var(--warn)">มีฉบับแก้ไขที่ยังไม่นำเข้า: '+esc(l.pending)+'</div>':'')+'</div>';
  }).join(''):'<div class="panel">ไม่พบเอกสารที่ตรงกับคำค้นในหมวดนี้ — ลองเปลี่ยนหมวดเป็น "ทั้งหมด" หรือเพิ่มเอกสารเองด้านล่าง</div>';
}

S.notes=function(){
  var h='<h2>บันทึก</h2><p class="lead">ข้อสรุปจากการหารือ (เก็บในแท็บ Notes ของชีต) ใช้ประกอบการประชุมหรือร่างหนังสือ</p><div class="notes" id="notes">';
  if(!APP.notes) h+='<div class="panel">กำลังโหลดบันทึก…</div>';
  else if(!APP.notes.length) h+='<div class="panel">ยังไม่มีบันทึก — ไปที่หน้า "หารือ" แล้วกด "บันทึกข้อสรุปนี้" ใต้คำตอบที่ต้องการเก็บ</div>';
  else APP.notes.forEach(function(n){h+='<div class="panel"><b>'+esc(n.title)+'</b><div class="meta">บันทึกเมื่อ '+esc(thDate(n.date))+' · '+esc(n.by)+'</div><p style="margin:6px 0 0;white-space:pre-wrap">'+esc(n.summary.length>320?n.summary.slice(0,320)+'…':n.summary)+'</p></div>';});
  h+='</div>';
  if(APP.notes&&APP.notes.length) h+='<div class="row" style="margin-top:12px"><button type="button" class="btn primary" id="memoBtn">ส่งออกเป็นร่างบันทึกข้อความ</button></div><div id="memo"></div>';
  return h;
};
function buildMemo(){
  var d=new Date(), th=d.toLocaleDateString('th-TH',{year:'numeric',month:'long',day:'numeric'});
  var body=APP.notes.slice(0,10).map(function(n,i){return (i+1)+'. '+n.title+'\n   '+n.summary.replace(/\n/g,'\n   ');}).join('\n\n');
  return 'บันทึกข้อความ\nส่วนราชการ  สำนักก่อสร้างทางที่ 2\nที่  ..................................  วันที่  '+th+'\nเรื่อง  สรุปผลการหารือข้อระเบียบที่เกี่ยวข้องกับงานจ้างก่อสร้าง\n\nเรียน  ..................................\n\n'+body+'\n\nจึงเรียนมาเพื่อโปรดพิจารณา\n\n(ร่างจากระบบ — โปรดตรวจถ้อยคำและเลขข้ออ้างอิงกับเอกสารต้นฉบับก่อนใช้)';
}
function noteSummary(L){
  var a=L.a, s=a.spoken||'';
  (a.citations||[]).forEach(function(c){s+='\n- '+c.docShort+' '+c.disp+': "'+c.quote+'"';});
  if(a.analysis) s+='\nข้อพิจารณา (ต้องตรวจสอบ): '+a.analysis;
  return s;
}

/* ================= ตัวควบคุม ================= */
function go(name){
  if(!S[name]) return;
  if(!GAS_MODE&&!AUTH.token&&name!=='guide'&&name!=='login'){ST.after=name;name='login';}
  ST.screen_prev=ST.screen; var changed=ST.screen!==name; ST.screen=name;
  main.innerHTML=S[name]();
  document.getElementById('tabs').hidden=(name==='guide'||name==='login');
  document.querySelectorAll('nav.tabs button').forEach(function(b){if(b.dataset.go===name)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  if(ST.screen_prev==='chat'&&name!=='chat') stopAll();
  document.documentElement.classList.toggle('on-chat',name==='chat');
  if(name==='chat') initChat();
  if(name==='login') initLogin();
  if(name==='library'){
    renderLib();
    if(!APP.docs) api('apiGetLibrary',[],function(r){APP.docs=r.docs;if(r.categories&&r.categories.length)APP.cats=r.categories;renderLib();},function(err){var b=document.getElementById('lib');if(b)b.innerHTML='<div class="panel status">โหลดคลังไม่สำเร็จ: '+esc(err)+'</div>';});
    document.getElementById('libq').oninput=function(){ST.q=this.value;renderLib();};
    var f=document.getElementById('pdf');
    document.getElementById('pdfBtn').onclick=function(){f.click();};
    f.onchange=function(){
      var file=f.files[0], b=document.getElementById('pdfBtn'), st=document.getElementById('pdfStatus');
      if(!file) return;
      if(!/\.pdf$/i.test(file.name)){st.textContent='รับเฉพาะไฟล์ PDF';return;}
      if(file.size>15*1024*1024){st.textContent='ไฟล์ใหญ่เกิน 15 MB';return;}
      st.textContent=''; b.disabled=true; b.classList.add('busy'); b.querySelector('span').textContent='กำลังอัปโหลด…';
      var rd=new FileReader();
      rd.onload=function(){
        api('apiUploadPdf',[{name:file.name,base64:String(rd.result).split(',')[1]}],function(r){
          b.classList.remove('busy'); b.classList.add('done'); b.querySelector('span').textContent='✓ เข้าคิวรอยืนยันแล้ว ('+r.qid+')';
          refreshInit();
          setTimeout(function(){b.classList.remove('done');b.disabled=false;b.querySelector('span').textContent='เลือกไฟล์ PDF';},2500);
          f.value='';
        },function(err){b.classList.remove('busy');b.disabled=false;b.querySelector('span').textContent='เลือกไฟล์ PDF';st.textContent='อัปโหลดไม่สำเร็จ: '+err;f.value='';});
      };
      rd.onerror=function(){b.classList.remove('busy');b.disabled=false;b.querySelector('span').textContent='เลือกไฟล์ PDF';st.textContent='อ่านไฟล์ไม่สำเร็จ';};
      rd.readAsDataURL(file);
    };
  }
  if(name==='notes'){
    if(!APP.notes) api('apiListNotes',[],function(r){APP.notes=r.notes;if(ST.screen==='notes')go('notes');},function(err){var n=document.getElementById('notes');if(n)n.innerHTML='<div class="panel status">โหลดบันทึกไม่สำเร็จ: '+esc(err)+'</div>';});
    else if(APP.notes.length) document.getElementById('memoBtn').onclick=function(){document.getElementById('memo').innerHTML='<h3>ร่างบันทึกข้อความ</h3><div class="memo">'+esc(buildMemo())+'</div>';};
  }
  if(changed) window.scrollTo(0,0);
}

function refreshInit(){api('apiInit',[],function(r){applyInit(r);if(ST.screen==='feed')go('feed');});}
function applyInit(r){
  APP.ready=true; APP.user=r.user; APP.settings=r.settings||APP.settings; APP.cats=r.categories||[]; APP.feed=r.feed||[]; APP.queue=r.queue||[]; APP.counts=r.counts||{};
  V.rate=(r.user&&r.user.rate)||APP.settings.ttsRate||1;
  if(r.user&&r.user.voice){V.voiceName=r.user.voice; var v=thaiVoice(); if(v) V.thaiVoice=v;}   /* ค่าที่เคยเลือกไว้ (เก็บในชีต) ตามไปทุกเครื่อง */

document.addEventListener('toggle',function(e){var d=e.target;if(d&&d.dataset&&d.dataset.clause&&d.open)loadClause(d);},true);
document.addEventListener('click',function(e){
  var t=e.target.closest('button'); if(!t) return;
  try{
    if(t.dataset.logout){logout();return;}
    if(t.dataset.go){go(t.dataset.go);return;}
    if(t.dataset.mode){ST.mode=t.dataset.mode;document.querySelectorAll('[data-mode]').forEach(function(b){b.setAttribute('aria-pressed',b===t);});renderSuggest();return;}
    if(t.dataset.ask){if(ST.screen!=='chat')go('chat');ask(t.dataset.ask);return;}
    if(t.dataset.replay!==undefined){var R=ST.log[+t.dataset.replay];if(R)say(R.a.spoken||'');return;}
    if(t.dataset.brief){briefing();return;}
    if(t.dataset.cat){ST.cat=t.dataset.cat;document.querySelectorAll('[data-cat]').forEach(function(b){b.setAttribute('aria-pressed',b===t);});renderLib();return;}
    if(t.dataset.discuss!==undefined){var f=APP.feed[+t.dataset.discuss];go('chat');showTyping(true);document.getElementById('ask').value='สรุปผลกระทบของ "'+f.title+'" ต่องานของกรมทางหลวง';document.getElementById('ask').focus();return;}
    if(t.dataset.read!==undefined){var on=t.getAttribute('aria-pressed')!=='true';t.setAttribute('aria-pressed',on);t.textContent=on?'✓ อ่านแล้ว':'ทำเครื่องหมายว่าอ่านแล้ว';t.classList.toggle('done',on);return;}
    if(t.dataset.accept||t.dataset.reject){
      var qid=t.dataset.accept||t.dataset.reject, action=t.dataset.accept?'accept':'reject', qs=document.getElementById('queueStatus');
      var card=document.getElementById('card-'+qid); card.querySelectorAll('button').forEach(function(b){b.disabled=true;});
      t.classList.add('busy'); t.querySelector('span').textContent='กำลังบันทึก…'; if(qs) qs.textContent='';
      api('apiQueueAction',[qid,action],function(r){
        t.classList.remove('busy'); t.classList.add('done'); t.querySelector('span').textContent=action==='accept'?'✓ ยืนยันแล้ว — รอนำเข้า':'✓ ปัดตกแล้ว';
        setTimeout(refreshInit,1800);
      },function(err){
        t.classList.remove('busy'); card.querySelectorAll('button').forEach(function(b){b.disabled=false;});
        t.querySelector('span').textContent=action==='accept'?'ยืนยันว่าเกี่ยวข้อง':'ไม่เกี่ยวข้อง'; if(qs) qs.textContent='บันทึกไม่สำเร็จ: '+err;
      });
      return;
    }
    if(t.dataset.fb){
      var up=t.dataset.fb==='up', row=t.parentNode;
      row.querySelectorAll('[data-fb]').forEach(function(b){b.setAttribute('aria-pressed',b===t);b.classList.toggle('done',b===t);});
      api('apiFeedback',[t.dataset.log,up?'up':'down',''],function(){},function(err){t.setAttribute('aria-pressed','false');t.classList.remove('done');});
      return;
    }
    if(t.dataset.save){
      var i=+t.dataset.save, L=ST.log[i], sst=document.querySelector('[data-save-status="'+i+'"]'); if(!L) return;
      t.disabled=true; t.classList.add('busy'); t.querySelector('span').textContent='กำลังบันทึก…'; if(sst) sst.textContent='';
      api('apiSaveNote',[{title:L.q,summary:noteSummary(L),refs:(L.a.citations||[]).map(function(c){return c.chunkId;}),logId:L.a.logId||''}],function(){
        t.classList.remove('busy'); t.classList.add('done'); t.querySelector('span').textContent='✓ บันทึกแล้ว'; APP.notes=null;
      },function(err){
        t.classList.remove('busy'); t.disabled=false; t.querySelector('span').textContent='บันทึกข้อสรุปนี้'; if(sst) sst.textContent='บันทึกไม่สำเร็จ: '+err;
      });
      return;
    }
  }catch(err){console.error('click error',err);}
});

/* เริ่มต้น: คู่มือย่อเป็นหน้าแรกเสมอ แล้วโหลดข้อมูลจากหลังบ้าน */

}else{

  (function(){
    function add(tag,attrs){var el=document.createElement(tag);for(var k in attrs)el.setAttribute(k,attrs[k]);document.head.appendChild(el);}
    add('link',{rel:'manifest',href:'manifest.webmanifest'});
    add('link',{rel:'apple-touch-icon',href:'icon-192.png'});
    add('meta',{name:'theme-color',content:'#1F3A5F'});
    add('meta',{name:'apple-mobile-web-app-capable',content:'yes'});
    add('meta',{name:'apple-mobile-web-app-title',content:'ระเบียบงานจ้าง'});
    if('serviceWorker' in navigator&&location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(function(e){console.warn('sw',e);});
    if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(API_URL)){var s=document.getElementById('initStatus');if(s)s.textContent='ยังไม่ได้กรอก API_URL ในไฟล์ index.html — ดูวิธีในคู่มือติดตั้ง';}
  })();
}
